[package]
name = "storyboard-studio-next"
version = "0.12.0"
description = "Storyboard planning, script highlighting and editor handoff"
authors = ["Filipe"]
edition = "2021"

[lib]
name = "storyboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
